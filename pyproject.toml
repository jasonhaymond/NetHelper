# Project metadata and tool configuration for NetHelper.
#
# - [project]: name, version, Python requirement, and the `nethelper` command
#   that `pip install .` creates. There are NO runtime dependencies: the tool
#   uses only Python's standard library so it runs anywhere Python 3.11+ does.
# - [project.optional-dependencies] dev: tools for testing and the security
#   suite only (never needed to run NetHelper). Exact versions are pinned in
#   requirements-dev.txt.
# - [tool.pytest.ini_options]: test discovery settings.
# - [tool.bandit]: the Python security linter's scope (the shipped package).

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nethelper"
version = "1.0.0"
description = "Cross-platform network troubleshooting toolkit (pure Python standard library)"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Haymond Technologies" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "bandit", "pip-audit", "ruff"]

[project.scripts]
nethelper = "nethelper.cli:main"

[tool.setuptools.packages.find]
include = ["nethelper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Ruff = code-quality linter (style, unused code, likely bugs). Security
# linting is Bandit's job in the security suite, so ruff's "S" rules (a copy
# of Bandit's) aren't enabled here to avoid duplicate suppressions.
[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.bandit]
# Bandit scans the shipped package (nethelper/); see scripts/security-check.ps1.
exclude_dirs = ["tests", ".venv"]
